<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <!-- Full-bleed background -->
  <rect width="1200" height="675" fill="#090e17" />

  <!-- Topbar -->
  <rect width="1200" height="46" fill="#131b28" />
  <line x1="0" y1="46" x2="1200" y2="46" stroke="rgba(255,255,255,0.08)" />

  <circle cx="28" cy="23" r="5" fill="#ff5f56" />
  <circle cx="46" cy="23" r="5" fill="#ffbd2e" />
  <circle cx="64" cy="23" r="5" fill="#27c93f" />

  <rect x="300" y="9" width="600" height="28" rx="6" fill="#090d15" stroke="rgba(255, 106, 0, 0.25)" stroke-width="1" />
  <text x="600" y="27" fill="#ff9d42" font-family="sans-serif" font-size="12" text-anchor="middle">
    https://radar-weather.telemetry.io/station/7041
  </text>

  <!-- Weather App Edge-to-Edge Layout -->
  <g transform="translate(60, 75)">
    <!-- Header Condition -->
    <text x="0" y="22" fill="#8494ab" font-family="sans-serif" font-size="13" font-weight="600" letter-spacing="1">LIVE TELEMETRY STATION</text>
    <text x="0" y="70" fill="#ffffff" font-family="sans-serif" font-size="46" font-weight="800">24°C</text>
    <text x="150" y="44" fill="#ff6a00" font-family="sans-serif" font-size="17" font-weight="bold">CLEAR / SOLAR HIGH</text>
    <text x="150" y="70" fill="#8494ab" font-family="sans-serif" font-size="14">Wind: 14 km/h E • Humidity: 42% • Barometer: 1014 hPa</text>
    <line x1="0" y1="95" x2="1080" y2="95" stroke="rgba(255,255,255,0.06)" />

    <!-- Radar Map Widget on Left -->
    <g transform="translate(0, 120)">
      <rect width="680" height="420" rx="12" fill="#080c14" stroke="rgba(255, 106, 0, 0.25)" stroke-width="1" />
      
      <!-- Radar circles -->
      <circle cx="340" cy="210" r="70" fill="none" stroke="rgba(255,106,0,0.2)" stroke-width="1" />
      <circle cx="340" cy="210" r="140" fill="none" stroke="rgba(255,106,0,0.2)" stroke-width="1" />
      <circle cx="340" cy="210" r="190" fill="none" stroke="rgba(255,106,0,0.12)" stroke-width="1" />
      <line x1="340" y1="20" x2="340" y2="400" stroke="rgba(255,106,0,0.15)" stroke-width="1" />
      <line x1="150" y1="210" x2="530" y2="210" stroke="rgba(255,106,0,0.15)" stroke-width="1" />

      <!-- Radar Beam -->
      <polygon points="340,210 460,70 510,110" fill="rgba(255,106,0,0.15)" />
      <circle cx="430" cy="120" r="5" fill="#ff6a00" />
      <circle cx="340" cy="210" r="7" fill="#ff6a00" />
      <text x="355" y="215" fill="#ff9d42" font-family="sans-serif" font-size="12" font-weight="bold">CURRENT RADAR</text>

      <!-- Wave Graph -->
      <path d="M 40 350 Q 180 290, 300 320 T 520 295 T 640 330" fill="none" stroke="#ff9d42" stroke-width="3" />
      <text x="40" y="390" fill="#8494ab" font-family="sans-serif" font-size="12">24h Atmospheric Pressure Variance</text>
    </g>

    <!-- Forecast on Right -->
    <g transform="translate(710, 120)">
      <rect width="370" height="420" rx="12" fill="#0f1623" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="30" y="45" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">5-DAY SATELLITE FORECAST</text>
      <line x1="30" y1="65" x2="340" y2="65" stroke="rgba(255,255,255,0.08)" />

      <g transform="translate(30, 95)">
        <text x="0" y="20" fill="#ff9d42" font-weight="bold" font-size="15">MON</text>
        <text x="120" y="20" fill="#fff" font-size="15">Sunny</text>
        <text x="240" y="20" fill="#ff6a00" font-weight="bold" font-size="15">26° / 18°</text>

        <text x="0" y="75" fill="#8494ab" font-weight="bold" font-size="15">TUE</text>
        <text x="120" y="75" fill="#fff" font-size="15">Scattered</text>
        <text x="240" y="75" fill="#8494ab" font-weight="bold" font-size="15">23° / 16°</text>

        <text x="0" y="130" fill="#8494ab" font-weight="bold" font-size="15">WED</text>
        <text x="120" y="130" fill="#fff" font-size="15">Overcast</text>
        <text x="240" y="130" fill="#8494ab" font-weight="bold" font-size="15">21° / 15°</text>

        <text x="0" y="185" fill="#8494ab" font-weight="bold" font-size="15">THU</text>
        <text x="120" y="185" fill="#fff" font-size="15">Showers</text>
        <text x="240" y="185" fill="#8494ab" font-weight="bold" font-size="15">19° / 14°</text>

        <text x="0" y="240" fill="#ff9d42" font-weight="bold" font-size="15">FRI</text>
        <text x="120" y="240" fill="#fff" font-size="15">Clear Sky</text>
        <text x="240" y="240" fill="#ff6a00" font-weight="bold" font-size="15">25° / 17°</text>
      </g>
    </g>
  </g>
</svg>
