<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <!-- Full-bleed background -->
  <rect width="1200" height="675" fill="#0c1017" />

  <!-- Topbar -->
  <rect width="1200" height="46" fill="#141923" />
  <line x1="0" y1="46" x2="1200" y2="46" stroke="rgba(255,255,255,0.08)" />

  <circle cx="28" cy="23" r="5" fill="#ff5f56" />
  <circle cx="46" cy="23" r="5" fill="#ffbd2e" />
  <circle cx="64" cy="23" r="5" fill="#27c93f" />

  <rect x="300" y="9" width="600" height="28" rx="6" fill="#090c12" stroke="rgba(255, 106, 0, 0.25)" stroke-width="1" />
  <text x="600" y="27" fill="#ff9d42" font-family="sans-serif" font-size="12" text-anchor="middle">
    wss://matrix-relay.realtime.net/channels/cyber-devs
  </text>

  <!-- Chat App Edge-to-Edge Layout -->
  <g transform="translate(0, 46)">
    <!-- Sidebar Channels -->
    <rect width="280" height="629" fill="#111620" />
    <line x1="280" y1="0" x2="280" y2="629" stroke="rgba(255,255,255,0.06)" />

    <g transform="translate(25, 30)">
      <text x="0" y="15" fill="#8893a4" font-family="sans-serif" font-size="12" font-weight="bold">ACTIVE CHANNELS</text>
      
      <rect x="0" y="30" width="230" height="40" rx="8" fill="#1a2230" stroke="rgba(255,106,0,0.3)" />
      <text x="16" y="55" fill="#ff9d42" font-weight="bold" font-size="14"># cyber-devs</text>

      <text x="16" y="105" fill="#717c8e" font-size="14"># architecture</text>
      <text x="16" y="150" fill="#717c8e" font-size="14"># deployment-logs</text>
      <text x="16" y="195" fill="#717c8e" font-size="14"># general</text>
    </g>

    <!-- Main Chat Feed -->
    <g transform="translate(310, 30)">
      <!-- Channel Header -->
      <text x="0" y="20" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold"># cyber-devs</text>
      <circle cx="140" cy="14" r="5" fill="#27c93f" />
      <text x="155" y="18" fill="#27c93f" font-family="sans-serif" font-size="12" font-weight="600">CONNECTED (8ms ping)</text>
      <line x1="0" y1="38" x2="850" y2="38" stroke="rgba(255,255,255,0.06)" />

      <!-- Messages -->
      <g transform="translate(0, 65)">
        <circle cx="20" cy="20" r="20" fill="#1a2230" stroke="#ff6a00" stroke-width="1.5" />
        <text x="20" y="25" fill="#ff6a00" font-weight="bold" font-size="12" text-anchor="middle">JD</text>
        <text x="55" y="16" fill="#ff9d42" font-weight="bold" font-size="14">Jose Romero</text>
        <text x="165" y="16" fill="#717c8e" font-size="12">11:42 AM</text>
        <text x="55" y="42" fill="#ffffff" font-size="14">Full-bleed edge-to-edge UI view activated. Zero padding around mockup.</text>
      </g>

      <g transform="translate(0, 145)">
        <circle cx="20" cy="20" r="20" fill="#192436" />
        <text x="20" y="25" fill="#27c93f" font-weight="bold" font-size="12" text-anchor="middle">RX</text>
        <text x="55" y="16" fill="#27c93f" font-weight="bold" font-size="14">Matrix Relay</text>
        <text x="155" y="16" fill="#717c8e" font-size="12">11:43 AM</text>
        <rect x="55" y="28" width="560" height="46" rx="8" fill="#121926" stroke="rgba(39, 201, 63, 0.3)" />
        <text x="70" y="56" fill="#27c93f" font-family="monospace" font-size="13">✓ WebSocket Handshake 101 Switching Protocols • Frame ACK 0ms</text>
      </g>

      <g transform="translate(0, 240)">
        <circle cx="20" cy="20" r="20" fill="#1a2230" stroke="#ff6a00" stroke-width="1.5" />
        <text x="20" y="25" fill="#ff6a00" font-weight="bold" font-size="12" text-anchor="middle">JD</text>
        <text x="55" y="16" fill="#ff9d42" font-weight="bold" font-size="14">Jose Romero</text>
        <text x="165" y="16" fill="#717c8e" font-size="12">11:45 AM</text>
        <text x="55" y="42" fill="#ffffff" font-size="14">Clean rendering with maximum container occupancy achieved.</text>
      </g>

      <!-- Input Bar -->
      <g transform="translate(0, 500)">
        <rect width="850" height="50" rx="10" fill="#141a26" stroke="rgba(255, 106, 0, 0.35)" stroke-width="1" />
        <text x="25" y="31" fill="#717c8e" font-size="14">Type a real-time message...</text>
        <rect x="750" y="8" width="90" height="34" rx="6" fill="#ff6a00" />
        <text x="795" y="30" fill="#000" font-weight="bold" font-size="12" text-anchor="middle">SEND</text>
      </g>
    </g>
  </g>
</svg>
