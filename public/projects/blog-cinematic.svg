<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <!-- Full-bleed background -->
  <rect width="1200" height="675" fill="#0d1118" />

  <!-- Topbar -->
  <rect width="1200" height="46" fill="#151b26" />
  <line x1="0" y1="46" x2="1200" y2="46" stroke="rgba(255,255,255,0.08)" />

  <circle cx="28" cy="23" r="5" fill="#ff5f56" />
  <circle cx="46" cy="23" r="5" fill="#ffbd2e" />
  <circle cx="64" cy="23" r="5" fill="#27c93f" />

  <rect x="300" y="9" width="600" height="28" rx="6" fill="#0b0e15" stroke="rgba(255, 106, 0, 0.25)" stroke-width="1" />
  <text x="600" y="27" fill="#ff9d42" font-family="sans-serif" font-size="12" text-anchor="middle">
    https://chronicles.dev/articles/crafting-modern-architectures
  </text>

  <!-- Article Edge-to-Edge Layout -->
  <g transform="translate(80, 85)">
    <g transform="translate(0, 0)">
      <rect width="100" height="26" rx="13" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.4)" stroke-width="1" />
      <text x="50" y="18" fill="#ff9d42" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TECH LOGS</text>
      <text x="120" y="18" fill="#7d8799" font-family="sans-serif" font-size="13">March 2026 • 6 min read • 4,200 views</text>
      
      <text x="0" y="68" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="800">
        Building Scalable Frontend Architectures with React &amp; Node
      </text>
      <text x="0" y="102" fill="#8893a4" font-family="sans-serif" font-size="16">
        A deep dive into state isolation, atomic design systems, and real-time backend synchronization.
      </text>
    </g>

    <!-- Code Snippet Box inside Article -->
    <g transform="translate(0, 135)">
      <rect width="1040" height="270" rx="10" fill="#080a10" stroke="rgba(255, 106, 0, 0.2)" stroke-width="1" />
      <g transform="translate(30, 40)">
        <text x="0" y="20" fill="#ff6a00" font-family="monospace" font-size="15">export async function</text>
        <text x="210" y="20" fill="#ffffff" font-family="monospace" font-size="15">streamPosts(query: QueryParams)</text>
        <text x="510" y="20" fill="#7d8799" font-family="monospace" font-size="15">{</text>
        <text x="30" y="60" fill="#7d8799" font-family="monospace" font-size="15">// Fetch edge-cached posts with MongoDB Aggregation</text>
        <text x="30" y="100" fill="#ff9d42" font-family="monospace" font-size="15">  const results = await db.collection("posts").aggregate([...]).toArray();</text>
        <text x="30" y="140" fill="#27c93f" font-family="monospace" font-size="15">  return new Response(JSON.stringify(results), { status: 200 });</text>
        <text x="0" y="180" fill="#7d8799" font-family="monospace" font-size="15">}</text>
      </g>
    </g>

