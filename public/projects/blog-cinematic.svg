      <text x="65" y="20" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Jose D. Romero</text>
      <text x="65" y="44" fill="#7d8799" font-family="sans-serif" font-size="13">Software Engineer • 24 Published Articles</text>
