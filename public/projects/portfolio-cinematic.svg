<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="cyber-orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6a00" />
      <stop offset="100%" stop-color="#ff9d42" />
    </linearGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Main Window Background -->
  <rect width="1200" height="675" fill="#0d1017" />

  <!-- Full-bleed Window Topbar -->
  <rect width="1200" height="46" fill="#151922" />
  <line x1="0" y1="46" x2="1200" y2="46" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="28" cy="23" r="5" fill="#ff5f56" />
  <circle cx="46" cy="23" r="5" fill="#ffbd2e" />
  <circle cx="64" cy="23" r="5" fill="#27c93f" />

  <!-- Address Bar -->
  <rect x="280" y="9" width="640" height="28" rx="6" fill="#090b10" stroke="rgba(255, 106, 0, 0.25)" stroke-width="1" />
  <text x="600" y="27" fill="#ff9d42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle" font-weight="500">
    https://its-jrdev.github.io/my-portfolio
  </text>

  <!-- Navigation Bar inside UI -->
  <g transform="translate(60, 75)">
    <rect width="28" height="28" rx="6" fill="#ff6a00" opacity="0.9" />
    <text x="40" y="19" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Its-JrDev — Portfolio</text>
    <text x="960" y="19" fill="#8b95a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Projects</text>
    <text x="1030" y="19" fill="#ff6a00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Contact</text>
    <line x1="0" y1="40" x2="1080" y2="40" stroke="rgba(255,255,255,0.06)" />
  </g>

  <!-- Hero Content inside UI -->
  <g transform="translate(60, 160)">
    <text x="0" y="40" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Jose D. Romero
    </text>
    <text x="0" y="80" fill="#ff6a00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">
      Web Developer &amp; UI Engineer
    </text>
    <text x="0" y="125" fill="#8b95a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Crafting responsive, high-performance web applications with modern React &amp; Tailwind CSS.
    </text>

    <!-- CTAs -->
    <g transform="translate(0, 175)">
      <rect width="160" height="44" rx="8" fill="url(#cyber-orange)" />
      <text x="80" y="27" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
        VIEW PROJECTS →
      </text>
      <rect x="180" y="0" width="150" height="44" rx="8" fill="transparent" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
      <text x="255" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
        GET IN TOUCH
      </text>
    </g>

    <!-- Interactive Graph Preview Canvas on the right -->
    <g transform="translate(620, -10)">
      <rect width="460" height="310" rx="12" fill="#090b10" stroke="rgba(255, 106, 0, 0.25)" stroke-width="1" />
      
      <!-- Graph Links -->
      <line x1="100" y1="80" x2="230" y2="150" stroke="#ff6a00" stroke-width="2" opacity="0.6" />
      <line x1="230" y1="150" x2="360" y2="80" stroke="#ff6a00" stroke-width="2" opacity="0.6" />
      <line x1="230" y1="150" x2="160" y2="240" stroke="#ff6a00" stroke-width="2" opacity="0.6" />
      <line x1="230" y1="150" x2="310" y2="240" stroke="#ff6a00" stroke-width="2" opacity="0.6" />
      <line x1="100" y1="80" x2="160" y2="240" stroke="#ff6a00" stroke-width="1" opacity="0.3" />
      <line x1="360" y1="80" x2="310" y2="240" stroke="#ff6a00" stroke-width="1" opacity="0.3" />

      <!-- Central Node -->
      <circle cx="230" cy="150" r="22" fill="#ff6a00" filter="url(#blur-glow)" />
      <circle cx="230" cy="150" r="18" fill="#ff6a00" />
      <text x="230" y="155" fill="#000" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">REACT</text>

      <!-- Surrounding Nodes -->
      <circle cx="100" cy="80" r="16" fill="#161c28" stroke="#ff6a00" stroke-width="1.5" />
      <text x="100" y="84" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">TS</text>

      <circle cx="360" cy="80" r="16" fill="#161c28" stroke="#ff6a00" stroke-width="1.5" />
      <text x="360" y="84" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CSS</text>

      <circle cx="160" cy="240" r="16" fill="#161c28" stroke="#ff6a00" stroke-width="1.5" />
      <text x="160" y="244" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">VITE</text>

      <circle cx="310" cy="240" r="16" fill="#161c28" stroke="#ff6a00" stroke-width="1.5" />
      <text x="310" y="244" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">D3</text>
    </g>
  </g>

  <!-- Bottom Edge Status Strip -->
  <g transform="translate(60, 520)">
    <rect width="1080" height="90" rx="8" fill="#121620" stroke="rgba(255, 255, 255, 0.06)" />
    <text x="24" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">PRODUCTION ARCHITECTURE</text>
    <text x="24" y="62" fill="#727d90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Interactive physics simulation • Responsive widescreen layout • Type-safe React components</text>
    <text x="940" y="50" fill="#27c93f" font-family="monospace" font-size="12" font-weight="bold">✓ 100% HEALTH</text>
  </g>
</svg>
