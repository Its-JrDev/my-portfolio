<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="orange-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6a00" />
      <stop offset="100%" stop-color="#ff8c2b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="1200" height="675" fill="#0d1118" />

  <!-- Topbar -->
  <rect width="1200" height="46" fill="#141923" />
  <line x1="0" y1="46" x2="1200" y2="46" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <circle cx="28" cy="23" r="5" fill="#ff5f56" />
  <circle cx="46" cy="23" r="5" fill="#ffbd2e" />
  <circle cx="64" cy="23" r="5" fill="#27c93f" />

  <rect x="300" y="9" width="600" height="28" rx="6" fill="#090c12" stroke="rgba(255, 106, 0, 0.25)" stroke-width="1" />
  <text x="600" y="27" fill="#ff9d42" font-family="sans-serif" font-size="12" text-anchor="middle">
    https://store.cyber-commerce.dev/catalog
  </text>

  <!-- Store Header -->
  <g transform="translate(60, 75)">
    <text x="0" y="24" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="700">Cyber Nexus Store</text>
    <text x="0" y="48" fill="#8d96a5" font-family="sans-serif" font-size="13">Full-Stack E-Commerce Engine • React • Node.js • PostgreSQL</text>

    <!-- Metrics Badge -->
    <g transform="translate(860, 5)">
      <rect width="220" height="40" rx="8" fill="#151b26" stroke="rgba(255, 106, 0, 0.3)" stroke-width="1" />
      <text x="20" y="25" fill="#ff9d42" font-family="sans-serif" font-size="12" font-weight="bold">99.9% UPTIME</text>
      <text x="130" y="25" fill="#27c93f" font-family="sans-serif" font-size="12" font-weight="bold">&lt;120ms API</text>
    </g>
    <line x1="0" y1="65" x2="1080" y2="65" stroke="rgba(255,255,255,0.06)" />
  </g>

  <!-- Product Catalog Grid -->
  <g transform="translate(60, 170)">
    <!-- Product 1 -->
    <g transform="translate(0, 0)">
      <rect width="330" height="450" rx="10" fill="#131822" stroke="rgba(255, 106, 0, 0.3)" stroke-width="1" />
      <rect x="20" y="20" width="290" height="220" rx="8" fill="#0a0d14" />
      <circle cx="165" cy="130" r="50" fill="rgba(255,106,0,0.15)" stroke="#ff6a00" stroke-width="1.5" />
      <path d="M145 130 L165 110 L185 130 L165 150 Z" fill="#ff6a00" />
      <text x="25" y="275" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Cyber Deck Rig X1</text>
      <text x="25" y="305" fill="#8d96a5" font-family="sans-serif" font-size="13">Hardware telemetry console</text>
      <text x="25" y="360" fill="#ff9d42" font-family="sans-serif" font-size="22" font-weight="bold">$1,299.00</text>
      <rect x="180" y="335" width="130" height="40" rx="6" fill="url(#orange-grad)" />
      <text x="245" y="360" fill="#000" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ADD TO CART</text>
    </g>

    <!-- Product 2 -->
    <g transform="translate(370, 0)">
      <rect width="330" height="450" rx="10" fill="#131822" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <rect x="20" y="20" width="290" height="220" rx="8" fill="#0a0d14" />
      <circle cx="165" cy="130" r="50" fill="rgba(39, 201, 63, 0.15)" stroke="#27c93f" stroke-width="1.5" />
      <rect x="145" y="110" width="40" height="40" rx="6" fill="#27c93f" opacity="0.8" />
      <text x="25" y="275" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Quantum Key Switch</text>
      <text x="25" y="305" fill="#8d96a5" font-family="sans-serif" font-size="13">Zero-latency optomechanical</text>
      <text x="25" y="360" fill="#27c93f" font-family="sans-serif" font-size="22" font-weight="bold">$189.00</text>
      <rect x="180" y="335" width="130" height="40" rx="6" fill="#202736" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="245" y="360" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">IN CART</text>
    </g>

    <!-- Order Pipeline Panel -->
    <g transform="translate(740, 0)">
      <rect width="340" height="450" rx="10" fill="#10151f" stroke="rgba(255, 106, 0, 0.2)" stroke-width="1" />
      <text x="25" y="40" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">ORDER PIPELINE</text>
      <line x1="25" y1="58" x2="315" y2="58" stroke="rgba(255,255,255,0.08)" />

      <g transform="translate(25, 90)">
        <circle cx="12" cy="12" r="7" fill="#27c93f" />
        <text x="32" y="17" fill="#ffffff" font-size="14">Auth Token Verified</text>
        <line x1="12" y1="24" x2="12" y2="50" stroke="#27c93f" stroke-width="2" />
        
        <circle cx="12" cy="58" r="7" fill="#27c93f" />
        <text x="32" y="63" fill="#ffffff" font-size="14">Cart Synced (PostgreSQL)</text>
        <line x1="12" y1="70" x2="12" y2="96" stroke="#ff6a00" stroke-width="2" />
        
        <circle cx="12" cy="104" r="7" fill="#ff6a00" />
        <text x="32" y="109" fill="#ff9d42" font-size="14">Stripe Webhook Ready</text>
        <line x1="12" y1="116" x2="12" y2="142" stroke="#444d5c" stroke-width="2" />

        <circle cx="12" cy="150" r="7" fill="#444d5c" />
        <text x="32" y="155" fill="#8d96a5" font-size="14">Fulfillment Queue</text>
      </g>

      <!-- Checkout Button -->
      <rect x="25" y="360" width="290" height="46" rx="8" fill="url(#orange-grad)" />
      <text x="170" y="389" fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
        PROCESS CHECKOUT
      </text>
    </g>
  </g>
</svg>
